<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flip Pomodoro</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto+Mono:wght@500;700&family=Poppins:wght@600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#000;--card:#1b1b1b;--dt:#ececec;--bd:#000;--ac:#ff5a4f;--font:'Oswald','Arial Narrow',sans-serif;--s:1;--fs:calc(min(21vw,30vh)*var(--s));box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
*{box-sizing:border-box}
body{background:var(--bg);color:#ddd;font:15px system-ui,sans-serif;overflow:hidden;display:flex}
body[data-cs=black]{--card:#000;--bd:#3a3a3a}
body[data-cs=light]{--card:#e9e6df;--dt:#111;--bd:#bbb}
body[data-cs=outline]{--card:transparent;--bd:var(--ac)}
body.tint{--dt:var(--ac)}
.app{margin:auto;display:flex;flex-direction:column;align-items:center;gap:calc(var(--fs)*.12);width:100%}
.clock{display:flex;align-items:center;justify-content:center;gap:.05em}
.clock.main{font-size:var(--fs)}
.clock.now{font-size:calc(var(--fs)*.25)}
.flip{position:relative;width:.7em;height:1em;perspective:4em}
.flip::after{content:"";position:absolute;left:0;right:0;top:calc(50% - .01em);height:.02em;background:#000;z-index:5}
.h{position:absolute;left:0;right:0;height:50%;overflow:hidden;background:var(--card);box-shadow:inset 0 0 0 1px var(--bd);backface-visibility:hidden}
.h span{position:absolute;left:0;right:0;height:200%;display:flex;align-items:center;justify-content:center;font:700 .86em/1 var(--font);color:var(--dt)}
.up,.fu{top:0;border-radius:.1em .1em 0 0}.up span,.fu span{top:0}
.down,.fd{bottom:0;border-radius:0 0 .1em .1em}.down span,.fd span{bottom:0}
.fu{transform-origin:bottom;z-index:3}
.fd{transform-origin:top;transform:rotateX(90deg);z-index:3}
.go .fu{animation:fu .25s ease-in forwards}
.go .fd{animation:fd .25s .25s ease-out both}
@keyframes fu{to{transform:rotateX(-90deg)}}
@keyframes fd{from{transform:rotateX(90deg)}to{transform:rotateX(0)}}
.nf .go .fu,.nf .go .fd{animation:none}
.col{width:.26em;height:1em;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:.16em}
.col i{width:.07em;height:.07em;border-radius:50%;background:var(--ac)}
.run .main .col i{animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:.25}}
.bar{height:3px;width:calc(var(--fs)*3.1);background:#1f1f1f;border-radius:2px;overflow:hidden}
.bar b{display:block;height:100%;width:0;background:var(--ac)}
.lbl{color:var(--ac);font:600 clamp(13px,calc(var(--fs)*.1),26px) var(--font);letter-spacing:.12em;text-transform:uppercase}
.dots{display:flex;gap:10px;align-items:center;font-size:13px;color:#888}
.dots i{width:10px;height:10px;border-radius:50%;border:2px solid var(--ac)}.dots i.f{background:var(--ac)}
.date{color:#777;font-size:clamp(12px,calc(var(--fs)*.07),20px);text-transform:capitalize}
.ui{transition:opacity .4s}
.idle .ui{opacity:0;pointer-events:none}
.idle{cursor:none}
.tabs,.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{font:inherit;color:#ddd;background:#141414;border:1px solid #2c2c2c;border-radius:10px;padding:9px 14px;cursor:pointer}
button:hover{background:#1f1f1f}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.tabs button{border-radius:20px;padding:6px 14px;font-size:13px}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#000;font-weight:600}
.btns button{min-width:52px;font-size:18px}
.btns .go2{background:var(--ac);border-color:var(--ac);color:#000;font-weight:700;min-width:120px}
.top{position:fixed;right:10px;top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:8px;z-index:4}
.top button{padding:7px 11px}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(390px,100%);background:#0e0e0e;border-left:1px solid #262626;transform:translateX(105%);transition:transform .3s;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 18px calc(30px + env(safe-area-inset-bottom,0px));z-index:10}
.dr.open{transform:none}
.dr h2{margin:0 0 4px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.dr h3{margin:22px 0 6px;font-size:13px;color:var(--ac);font-weight:600;border-bottom:1px solid #222;padding-bottom:5px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:7px 0;font-size:14px}
.row input[type=number]{width:72px}.row input[type=range]{width:140px;accent-color:var(--ac)}
input,select{background:#181818;color:#eee;border:1px solid #2d2d2d;border-radius:8px;padding:6px 8px;font:inherit}
input[type=checkbox]{width:42px;height:24px;appearance:none;background:#2a2a2a;border-radius:12px;position:relative;cursor:pointer;border:0;padding:0;flex:none}
input[type=checkbox]::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#888;transition:.2s}
input[type=checkbox]:checked{background:var(--ac)}input[type=checkbox]:checked::after{left:21px;background:#000}
input[type=color]{width:44px;height:30px;padding:2px}
.sm{font-size:12px;color:#777;margin-top:4px}
.dr .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.veil{position:fixed;inset:0;background:#0008;z-index:9;display:none}.veil.open{display:block}
@media(max-width:560px){.btns .go2{min-width:96px}}
@media(prefers-reduced-motion:reduce){.go .fu,.go .fd{animation:none}}
</style></head>
<body>
<main class="app" id="app">
  <div class="tabs ui" id="tabs"></div>
  <div class="lbl" id="lbl"></div>
  <div class="clock main" id="pomo"></div>
  <div class="bar"><b id="bar"></b></div>
  <div class="dots" id="dots"></div>
  <div class="btns ui" id="btns">
    <button id="bReset" title="Reiniciar (R)">↺</button>
    <button id="bGo" class="go2" title="Iniciar / pausar (Espacio)">Iniciar</button>
    <button id="bSkip" title="Saltar (S)">⏭</button>
  </div>
  <div class="clock now" id="now"></div>
  <div class="date" id="date"></div>
</main>
<div class="top ui"><button id="bFull" title="Pantalla completa (F)">⛶</button><button id="bCfg" title="Configuración (C)">⚙</button></div>
<div class="veil" id="veil"></div>
<aside class="dr" id="dr" aria-label="Configuración"><h2>Configuración <button id="bClose">✕</button></h2><div id="form"></div>
<div class="acts"><button id="bTest">🔔 Probar sonido</button><button id="bStats">Borrar contador de hoy</button><button id="bDef">Restablecer todo</button></div>
<p class="sm">Los ajustes se guardan en este navegador. Atajos: Espacio, R, S, F, C.</p></aside>
<script>
const $=s=>document.querySelector(s);
const DEF={focus:25,short:5,long:15,every:4,autoBreak:true,autoFocus:false,goal:8,
showTime:true,h24:true,secs:true,date:true,size:100,
label:true,dots:true,ctrl:true,tabs:true,bar:true,hideUI:false,flip:true,cs:'dark',tint:false,font:"'Oswald','Arial Narrow',sans-serif",bg:'#000000',cFocus:'#ff5a4f',cShort:'#4fd1a5',cLong:'#5aa8ff',title:true,
sound:true,snd:'bell',vol:70,rep:2,
notify:false,vib:true,wake:false,keys:true};
const SC=[
['Tiempos',[['focus','Pomodoro (minutos)','n',1,180],['short','Descanso corto (min)','n',1,60],['long','Descanso largo (min)','n',1,120],['every','Pomodoros antes del descanso largo','n',2,12],['goal','Meta diaria de pomodoros','n',1,30]]],
['Automatización',[['autoBreak','Iniciar descansos automáticamente','b'],['autoFocus','Iniciar pomodoros automáticamente','b']]],
['Hora actual',[['showTime','Mostrar la hora actual','b'],['h24','Formato de 24 horas','b'],['secs','Mostrar segundos','b'],['date','Mostrar la fecha','b']]],
['Pantalla',[['size','Tamaño del reloj (%)','r',50,130],['flip','Animación flip','b'],['label','Mostrar nombre de la fase','b'],['dots','Mostrar pomodoros completados','b'],['bar','Mostrar barra de progreso','b'],['tabs','Mostrar selector de fase','b'],['ctrl','Mostrar botones de control','b'],['hideUI','Modo inmersivo (oculta controles al correr)','b'],['title','Mostrar el tiempo en la pestaña','b']]],
['Estilo',[['cs','Estilo de tarjetas','s',[['dark','Gris oscuro'],['black','Negro con borde'],['light','Claro'],['outline','Solo contorno']]],['tint','Dígitos con color de la fase','b'],['font','Tipografía','s',[["'Oswald','Arial Narrow',sans-serif",'Condensada'],["'Roboto Mono',ui-monospace,monospace",'Monoespaciada'],["'Poppins',system-ui,sans-serif",'Redondeada']]],['bg','Color de fondo','c'],['cFocus','Color: pomodoro','c'],['cShort','Color: descanso corto','c'],['cLong','Color: descanso largo','c']]],
['Sonido',[['sound','Sonido al terminar','b'],['snd','Tipo de sonido','s',[['bell','Campana'],['digital','Digital'],['chime','Carillón']]],['vol','Volumen','r',0,100],['rep','Repeticiones','n',1,6]]],
['Avisos y sistema',[['notify','Notificaciones del navegador','b'],['vib','Vibrar al terminar (móvil)','b'],['wake','Mantener la pantalla encendida','b'],['keys','Atajos de teclado','b']]]];
const ld=(k,d)=>{try{return Object.assign({},d,JSON.parse(localStorage.getItem(k)))}catch(e){return{...d}}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let cfg=ld('fp_cfg',DEF);
const todayKey=()=>new Date().toDateString();
let stats=ld('fp_stats',{d:todayKey(),n:0});if(stats.d!==todayKey())stats={d:todayKey(),n:0};

/* ---------- flip clock ---------- */
function mk(){const e=document.createElement('div');e.className='flip';e.innerHTML='<div class="h up"><span></span></div><div class="h down"><span></span></div><div class="h fu"><span></span></div><div class="h fd"><span></span></div>';e.v='';return e}
function setD(e,v,anim){if(e.v===v)return;const s=e.querySelectorAll('span');
 if(!anim||e.v===''){s.forEach(x=>x.textContent=v);e.v=v;return}
 const o=e.v;e.v=v;e.classList.remove('go');s[0].textContent=v;s[1].textContent=o;s[2].textContent=o;s[3].textContent=v;void e.offsetWidth;e.classList.add('go');
 clearTimeout(e.t);e.t=setTimeout(()=>{s.forEach(x=>x.textContent=v);e.classList.remove('go')},520)}
function Clock(el){let ds=[],key='';return str=>{const k=str.replace(/\d/g,'d');
 if(k!==key){key=k;el.innerHTML='';ds=[];for(const c of str){if(c===':'){const d=document.createElement('div');d.className='col';d.innerHTML='<i></i><i></i>';el.appendChild(d)}else{const f=mk();ds.push(f);el.appendChild(f)}}
  let i=0;for(const c of str)if(c!==':')setD(ds[i++],c,false);return}
 let i=0;for(const c of str)if(c!==':')setD(ds[i++],c,cfg.flip)}}
const cPomo=Clock($('#pomo')),cNow=Clock($('#now'));

/* ---------- timer ---------- */
const NAMES={focus:'Pomodoro',short:'Descanso corto',long:'Descanso largo'};
const dur=m=>cfg[m]*60000;
let mode='focus',rem=dur('focus'),running=false,endAt=0,cycle=0,lock=null;
function start(){if(running)return;audio();running=true;endAt=Date.now()+rem;getLock();render()}
function pause(){if(!running)return;rem=Math.max(0,endAt-Date.now());running=false;relLock();render()}
function setMode(m){mode=m;rem=dur(m);running=false;relLock();render()}
function reset(){running=false;rem=dur(mode);relLock();render()}
function skip(){if(mode==='focus')setMode(cycle+1>=cfg.every?(cycle=0,'long'):(cycle++,'short'));else setMode('focus')}
function finish(){running=false;alertEnd();
 let next;if(mode==='focus'){stats.n++;sv('fp_stats',stats);cycle++;if(cycle>=cfg.every){cycle=0;next='long'}else next='short'}else next='focus';
 setMode(next);if(next==='focus'?cfg.autoFocus:cfg.autoBreak)start()}
async function getLock(){if(cfg.wake&&'wakeLock' in navigator){try{lock=await navigator.wakeLock.request('screen')}catch(e){}}}
function relLock(){try{lock&&lock.release()}catch(e){}lock=null}
document.addEventListener('visibilitychange',()=>{if(running&&!document.hidden)getLock()});

/* ---------- sonido y avisos ---------- */
let ac;function audio(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}return ac}
function tone(f,t,d,type,v){const a=audio();if(!a)return;const o=a.createOscillator(),g=a.createGain(),T=a.currentTime+t;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,T);g.gain.linearRampToValueAtTime(v,T+.01);g.gain.exponentialRampToValueAtTime(.0001,T+d);o.connect(g).connect(a.destination);o.start(T);o.stop(T+d+.05)}
function play(){const v=cfg.vol/100*.5;if(v<=0)return;for(let i=0;i<cfg.rep;i++){const b=i*1.3;
 if(cfg.snd==='bell'){tone(880,b,1.1,'sine',v);tone(1760,b,.6,'sine',v*.4)}
 else if(cfg.snd==='digital'){[0,.18,.36].forEach(x=>tone(1000,b+x,.1,'square',v*.4))}
 else[523,659,784].forEach((f,j)=>tone(f,b+j*.2,.8,'triangle',v))}}
function alertEnd(){if(cfg.sound)play();if(cfg.vib&&navigator.vibrate)navigator.vibrate([250,120,250]);
 if(cfg.notify&&'Notification' in window&&Notification.permission==='granted'){try{new Notification(mode==='focus'?'¡Pomodoro terminado!':'Fin del descanso',{body:'Siguiente: '+(mode==='focus'?'descanso':'pomodoro')})}catch(e){}}}

/* ---------- render ---------- */
const p2=n=>String(n).padStart(2,'0');
function draw(){
 const ms=running?Math.max(0,endAt-Date.now()):rem,tot=Math.ceil(ms/1000),m=Math.floor(tot/60),s=tot%60;
 cPomo((m>99?String(m):p2(m))+':'+p2(s));
 $('#bar').style.width=(100-ms/dur(mode)*100)+'%';
 if(cfg.title)document.title=p2(m)+':'+p2(s)+' · '+NAMES[mode];else document.title='Flip Pomodoro';
 const d=new Date();let h=d.getHours();if(!cfg.h24)h=h%12||12;
 cNow((cfg.h24?p2(h):String(h).padStart(2,'0'))+':'+p2(d.getMinutes())+(cfg.secs?':'+p2(d.getSeconds()):''));
 $('#date').textContent=d.toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+(cfg.h24?'':' · '+(d.getHours()<12?'a. m.':'p. m.'));
 if(running&&ms<=0)finish()}
function render(){
 const col={focus:cfg.cFocus,short:cfg.cShort,long:cfg.cLong}[mode];
 const r=document.documentElement.style;r.setProperty('--ac',col);r.setProperty('--bg',cfg.bg);r.setProperty('--s',cfg.size/100);r.setProperty('--font',cfg.font);
 document.body.style.background=cfg.bg;
 document.body.dataset.cs=cfg.cs;document.body.classList.toggle('tint',cfg.tint);document.body.classList.toggle('nf',!cfg.flip);document.body.classList.toggle('run',running);
 $('#bGo').textContent=running?'Pausa':'Iniciar';
 $('#tabs').innerHTML='';for(const k of['focus','short','long']){const b=document.createElement('button');b.textContent=NAMES[k];b.className=k===mode?'on':'';b.onclick=()=>setMode(k);$('#tabs').appendChild(b)}
 $('#tabs').style.display=cfg.tabs?'':'none';
 $('#btns').style.display=cfg.ctrl?'':'none';
 $('#lbl').style.display=cfg.label?'':'none';$('#lbl').textContent=NAMES[mode];
 $('.bar').style.display=cfg.bar?'':'none';
 $('#now').style.display=$('#date').style.display='';
 $('#now').style.display=cfg.showTime?'':'none';$('#date').style.display=cfg.showTime&&cfg.date?'':'none';
 const dt=$('#dots');dt.style.display=cfg.dots?'':'none';dt.innerHTML='';
 const fill=mode==='long'?cfg.every:cycle;for(let i=0;i<cfg.every;i++){const e=document.createElement('i');if(i<fill)e.className='f';dt.appendChild(e)}
 const t=document.createElement('span');t.textContent='Hoy: '+stats.n+' / '+cfg.goal+(stats.n>=cfg.goal?' ✓':'');dt.appendChild(t);
 draw()}
setInterval(draw,250);

/* ---------- panel de configuración ---------- */
function build(){const f=$('#form');f.innerHTML='';
 for(const[t,items]of SC){const h=document.createElement('h3');h.textContent=t;f.appendChild(h);
  for(const[k,l,ty,a,b]of items){const row=document.createElement('label');row.className='row';const sp=document.createElement('span');sp.textContent=l;row.appendChild(sp);let inp;
   if(ty==='s'){inp=document.createElement('select');a.forEach(([v,n])=>{const o=document.createElement('option');o.value=v;o.textContent=n;inp.appendChild(o)});inp.value=cfg[k]}
   else{inp=document.createElement('input');if(ty==='b'){inp.type='checkbox';inp.checked=cfg[k]}else if(ty==='c'){inp.type='color';inp.value=cfg[k]}else{inp.type=ty==='n'?'number':'range';inp.min=a;inp.max=b;inp.value=cfg[k]}}
   inp.oninput=inp.onchange=async()=>{let v=inp.type==='checkbox'?inp.checked:(inp.type==='number'||inp.type==='range')?Math.min(+inp.max,Math.max(+inp.min,+inp.value||+inp.min)):inp.value;
    if(inp.type==='number'&&inp.value==='')return;cfg[k]=v;sv('fp_cfg',cfg);
    if(k==='notify'&&v&&'Notification' in window&&Notification.permission!=='granted'){const p=await Notification.requestPermission();if(p!=='granted'){cfg.notify=false;inp.checked=false;sv('fp_cfg',cfg)}}
    if(k==='wake'){v?running&&getLock():relLock()}
    if(['focus','short','long'].includes(k)&&!running)rem=dur(mode);
    if(k==='every'&&cycle>=v)cycle=0;
    render()};
   row.appendChild(inp);f.appendChild(row)}}}
const open=o=>{$('#dr').classList.toggle('open',o);$('#veil').classList.toggle('open',o)};
$('#bCfg').onclick=()=>open(true);$('#bClose').onclick=$('#veil').onclick=()=>open(false);
$('#bTest').onclick=play;
$('#bStats').onclick=()=>{stats={d:todayKey(),n:0};sv('fp_stats',stats);render()};
$('#bDef').onclick=()=>{if(confirm('¿Restablecer todos los ajustes?')){cfg={...DEF};sv('fp_cfg',cfg);build();setMode('focus')}};
$('#bGo').onclick=()=>running?pause():start();$('#bReset').onclick=reset;$('#bSkip').onclick=skip;
const full=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})};
$('#bFull').onclick=full;
document.addEventListener('keydown',e=>{if(!cfg.keys||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||e.ctrlKey||e.metaKey)return;
 const k=e.key.toLowerCase();if(k===' '){e.preventDefault();running?pause():start()}else if(k==='r')reset();else if(k==='s')skip();else if(k==='f')full();else if(k==='c')open(!$('#dr').classList.contains('open'));else if(k==='escape')open(false)});
let it;const wake=()=>{document.body.classList.remove('idle');clearTimeout(it);if(cfg.hideUI&&running)it=setTimeout(()=>document.body.classList.add('idle'),3000)};
['pointermove','pointerdown','keydown'].forEach(ev=>addEventListener(ev,wake));
setInterval(()=>{if(cfg.hideUI&&running&&!it)wake()},1000);
build();render();
</script></body></html>
